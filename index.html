var LKEY='es2026-gate-key-v1';
function showGate(msg){
  document.getElementById('gate').style.display='block';
  if (msg) document.getElementById('err').textContent=msg;
  document.getElementById('pw').focus();
}
function b64(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); }
async function keyFromPw(pw){
  var km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(SALT), iterations:ITER, hash:'SHA-256'},
    km, {name:'AES-GCM', length:256}, true, ['decrypt']);
}
async function unlock(key){
  var plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(IV)}, key, b64(DATA));
  var html = new TextDecoder().decode(plain);
  document.open(); document.write(html); document.close();
}
document.getElementById('f').addEventListener('submit', async function(e){
  e.preventDefault();
  var pw = document.getElementById('pw').value;
  if (!pw) return;
  document.getElementById('err').textContent = '解锁中…';
  try {
    var key = await keyFromPw(pw);
    await unlock(key);   /* 密码错误会在这里抛异常 */
    try {
      var raw = await crypto.subtle.exportKey('raw', key);
      localStorage.setItem(LKEY, btoa(String.fromCharCode.apply(null, new Uint8Array(raw))));
    } catch(_){}
  } catch(_){
    document.getElementById('err').textContent = '密码不对，再试一次';
  }
});
setTimeout(async function(){
  if (!window.crypto || !crypto.subtle){ showGate('当前浏览器不支持解密，请换系统浏览器打开'); return; }
  var cached = null;
  try { cached = localStorage.getItem(LKEY); } catch(_){}
  if (cached){
    try {
      var key = await crypto.subtle.importKey('raw', b64(cached), {name:'AES-GCM', length:256}, false, ['decrypt']);
      await unlock(key);
      return;
    } catch(_){ try { localStorage.removeItem(LKEY); } catch(__){} }
  }
  showGate();
}, 0);
</script>
